<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title description">
  <title id="title">브라우저에서 집 맥미니까지</title>
  <desc id="description">브라우저 요청이 Cloudflare를 거쳐 맥미니로 전달되고, 맥미니는 외장 SSD와 OpenAI API를 사용한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#858585" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <g fill="#242424" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="400" text-anchor="middle">
    <text x="210" y="58">브라우저</text>
    <text x="210" y="188">Cloudflare</text>
    <text x="210" y="318">Mac mini</text>
  </g>
  <g fill="none" stroke="#858585" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M210 75V145" />
    <path d="M210 205V275" />
    <path d="M210 335V405H105V435" />
    <path d="M210 405H315V435" />
  </g>
  <g fill="#555" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="middle">
    <text x="105" y="482">외장 SSD</text>
    <text x="315" y="482">OpenAI API</text>
  </g>
</svg>
